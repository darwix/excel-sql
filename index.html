<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Excel SQL Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alasql@4"></script>
    <script src="lib.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px system-ui,
          sans-serif;
        display: flex;
        height: 100vh;
        color: #1a1a1a;
      }
      aside {
        width: 300px;
        padding: 16px;
        border-right: 1px solid #ddd;
        overflow: auto;
      }
      main {
        flex: 1;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      select,
      button {
        padding: 6px 10px;
        font: inherit;
      }
      aside > * {
        margin-bottom: 10px;
      }
      textarea {
        width: 100%;
        height: 110px;
        font:
          13px ui-monospace,
          monospace;
        padding: 8px;
      }
      code {
        background: #f1f1f1;
        padding: 1px 5px;
        border-radius: 3px;
      }
      li {
        margin: 4px 0;
      }
      ul {
        padding-left: 18px;
      }
      small {
        color: #777;
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #err {
        color: #b00020;
        min-height: 1.2em;
      }
      #preview {
        overflow: auto;
        flex: 1;
        border: 1px solid #ddd;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border-bottom: 1px solid #eee;
        padding: 4px 8px;
        text-align: left;
        white-space: nowrap;
      }
      th {
        position: sticky;
        top: 0;
        background: #f7f7f7;
      }
    </style>
  </head>
  <body>
    <aside>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" />
      <select id="sheet" hidden></select>
      <div><small>Table: </small><code id="tbl">-</code></div>
      <ul id="cols"></ul>
      <small>Every sheet is a table, so JOIN across sheets works.</small>
    </aside>
    <main>
      <textarea
        id="sql"
        spellcheck="false"
        placeholder="SELECT * FROM sheet1 WHERE ..."
      ></textarea>
      <div class="bar">
        <button id="copy" disabled>Copy rows</button>
        <button id="dl" disabled>Download Excel</button>
        <small id="count"></small>
      </div>
      <div id="err"></div>
      <div id="preview"></div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const MAX_PREVIEW = 200;
      let sheets = {}; // table name -> { cols: [{name, orig}], rows }
      let result = [];

      $("file").onchange = async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const wb = XLSX.read(await f.arrayBuffer(), { cellDates: true });
        const names = snakeHeaders(wb.SheetNames);
        sheets = {};
        wb.SheetNames.forEach((sn, i) => {
          const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {
            header: 1,
            defval: null,
          });
          const orig = (aoa[0] || []).map((h) => h ?? "");
          const cols = snakeHeaders(orig);
          const rows = aoa
            .slice(1)
            .map((r) =>
              Object.fromEntries(cols.map((c, j) => [c, r[j] ?? null])),
            );
          sheets[names[i]] = {
            cols: cols.map((name, j) => ({ name, orig: orig[j] })),
            rows,
          };
          alasql(
            `DROP TABLE IF EXISTS \`${names[i]}\`; CREATE TABLE \`${names[i]}\``,
          );
          alasql.tables[names[i]].data = rows;
        });
        $("sheet").innerHTML = names
          .map((n, i) => `<option value="${n}">${wb.SheetNames[i]}</option>`)
          .join("");
        $("sheet").hidden = names.length < 2;
        pick(names[0]);
      };

      $("sheet").onchange = () => pick($("sheet").value);

      function pick(t) {
        $("tbl").textContent = t;
        $("cols").replaceChildren(
          ...sheets[t].cols.map((c) => {
            const li = document.createElement("li");
            li.textContent = c.name;
            li.title = `Original: ${c.orig}`;
            return li;
          }),
        );
        $("sql").value = `SELECT * FROM ${t}`;
        run();
      }

      function run() {
        $("err").textContent = "";
        try {
          result = alasql($("sql").value);
          if (!Array.isArray(result))
            throw new Error("Query must return rows (use SELECT)");
        } catch (e) {
          $("err").textContent = e.message;
          return;
        }
        render();
      }

      function render() {
        const keys = result.length ? Object.keys(result[0]) : [];
        const t = document.createElement("table");
        t.innerHTML = "<thead><tr></tr></thead><tbody></tbody>";
        t.tHead.rows[0].replaceChildren(
          ...keys.map((k) =>
            Object.assign(document.createElement("th"), { textContent: k }),
          ),
        );
        result.slice(0, MAX_PREVIEW).forEach((r) => {
          const tr = t.tBodies[0].insertRow();
          keys.forEach((k) => (tr.insertCell().textContent = fmt(r[k])));
        });
        $("preview").replaceChildren(t);
        $("count").textContent =
          `${result.length} rows` +
          (result.length > MAX_PREVIEW ? ` (showing ${MAX_PREVIEW})` : "");
        $("copy").disabled = $("dl").disabled = !result.length;
      }

      const fmt = (v) =>
        v instanceof Date ? v.toISOString().slice(0, 10) : (v ?? "");

      let timer;
      $("sql").oninput = () => (
        clearTimeout(timer),
        (timer = setTimeout(run, 300))
      );

      $("copy").onclick = async () => {
        const keys = Object.keys(result[0]);
        const tsv = [
          keys,
          ...result.map((r) =>
            keys.map((k) => String(fmt(r[k])).replace(/[\t\r\n]+/g, " ")),
          ),
        ];
        await navigator.clipboard.writeText(
          tsv.map((r) => r.join("\t")).join("\n"),
        );
        $("copy").textContent = "Copied!";
        setTimeout(() => ($("copy").textContent = "Copy rows"), 1200);
      };

      $("dl").onclick = () => {
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(
          wb,
          XLSX.utils.json_to_sheet(result),
          "result",
        );
        XLSX.writeFile(wb, "converted.xlsx");
      };
    </script>
  </body>
</html>

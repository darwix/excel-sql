<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Excel SQL Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alasql@4"></script>
    <script src="lib.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f4ef;
        --panel: #efece4;
        --ink: #1c1b18;
        --muted: #7a766c;
        --line: #dedacf;
        --accent: #2f6f5e;
        --accent-ink: #fff;
        --err: #a3262a;
        --mono: "Geist Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          400 14px/1.5 Geist,
          system-ui,
          sans-serif;
        display: flex;
        height: 100dvh;
        color: var(--ink);
        background: var(--bg);
      }
      aside {
        width: 300px;
        padding: 24px 20px;
        background: var(--panel);
        border-right: 1px solid var(--line);
        overflow: auto;
      }
      main {
        flex: 1;
        padding: 24px 28px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      aside > * {
        margin-bottom: 14px;
      }
      input[type="file"]::file-selector-button,
      button {
        font:
          500 13px Geist,
          sans-serif;
        padding: 7px 14px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
      }
      input[type="file"]::file-selector-button {
        margin-right: 10px;
      }
      input[type="file"]::file-selector-button:hover,
      button:hover:not(:disabled) {
        background: var(--bg);
      }
      #dl:not(:disabled) {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      #dl:hover:not(:disabled) {
        background: #265b4d;
      }
      button:active:not(:disabled) {
        transform: scale(0.98);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      select {
        width: 100%;
        padding: 7px 10px;
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }
      textarea {
        width: 100%;
        height: 120px;
        font: 400 13px/1.6 var(--mono);
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        resize: vertical;
      }
      code {
        font: 500 12px var(--mono);
        background: #fff;
        padding: 2px 6px;
        border-radius: 4px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0 0 14px;
      }
      li {
        font: 400 12.5px var(--mono);
        padding: 4px 0;
        border-bottom: 1px solid var(--line);
      }
      #tables li {
        cursor: pointer;
      }
      #tables li:hover {
        color: var(--accent);
      }
      #tables li[aria-current] {
        font-weight: 500;
        color: var(--accent);
      }
      small {
        color: var(--muted);
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #count {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      #err {
        color: var(--err);
        min-height: 1.4em;
      }
      #preview {
        overflow: auto;
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }
      .empty {
        margin: 0;
        padding: 48px 24px;
        max-width: 42ch;
        color: var(--muted);
        text-wrap: pretty;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        border-bottom: 1px solid #efece4;
        padding: 6px 12px;
        text-align: left;
        white-space: nowrap;
      }
      th {
        position: sticky;
        top: 0;
        background: var(--panel);
        font: 500 12px var(--mono);
      }
      @media (max-width: 720px) {
        body {
          flex-direction: column;
          height: auto;
          min-height: 100dvh;
        }
        aside {
          width: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <h2>Source</h2>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" />
      <select id="sheet" hidden></select>
      <div><small>Table: </small><code id="tbl">-</code></div>
      <h2>Columns</h2>
      <ul id="cols"></ul>
      <h2>Tables</h2>
      <ul id="tables"></ul>
      <small
        >Every sheet is a table. <code>all_sheets</code> stacks them all, with a
        <code>sheet_name</code> column.</small
      >
    </aside>
    <main>
      <textarea
        id="sql"
        spellcheck="false"
        placeholder="SELECT * FROM sheet1 WHERE ..."
      ></textarea>
      <div class="bar">
        <button id="copy" disabled>Copy rows</button>
        <button id="dl" disabled>Download Excel</button>
        <small id="count"></small>
      </div>
      <div id="err"></div>
      <div id="preview">
        <p class="empty">
          Upload a spreadsheet to see it here. Each sheet becomes a table you
          can query with SQL.
        </p>
      </div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const MAX_PREVIEW = 200;
      let sheets = {}; // table name -> { cols: [{name, orig}], rows }
      let result = [];

      $("file").onchange = async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const wb = XLSX.read(await f.arrayBuffer(), { cellDates: true });
        const names = snakeHeaders(wb.SheetNames);
        sheets = {};
        wb.SheetNames.forEach((sn, i) => {
          const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {
            header: 1,
            defval: null,
          });
          const orig = (aoa[0] || []).map((h) => h ?? "");
          const cols = snakeHeaders(orig);
          const rows = dropBlankRows(aoa.slice(1)).map((r) =>
            Object.fromEntries(cols.map((c, j) => [c, r[j] ?? null])),
          );
          sheets[names[i]] = {
            label: sn,
            cols: cols.map((name, j) => ({ name, orig: orig[j] })),
          };
          alasql(
            `DROP TABLE IF EXISTS \`${names[i]}\`; CREATE TABLE \`${names[i]}\``,
          );
          alasql.tables[names[i]].data = rows;
        });
        $("sheet").innerHTML = names
          .map((n, i) => `<option value="${n}">${wb.SheetNames[i]}</option>`)
          .join("");
        $("sheet").hidden = names.length < 2;
        const all = stackSheets(
          Object.entries(sheets).map(([t, s]) => ({
            label: s.label,
            rows: alasql.tables[t].data,
          })),
        );
        alasql("DROP TABLE IF EXISTS all_sheets; CREATE TABLE all_sheets");
        alasql.tables.all_sheets.data = all;
        pick(names[0]);
      };

      $("sheet").onchange = () => pick($("sheet").value);

      function pick(t) {
        $("tbl").textContent = t;
        $("cols").replaceChildren(
          ...sheets[t].cols.map((c) => {
            const li = document.createElement("li");
            li.textContent = c.name;
            li.title = `Original: ${c.orig}`;
            return li;
          }),
        );
        show(t);
      }

      function show(t) {
        listTables(t);
        $("sql").value = `SELECT * FROM ${t}`;
        run();
      }

      function listTables(current) {
        $("tables").replaceChildren(
          ...[...Object.keys(sheets), "all_sheets"].map((t) => {
            const li = document.createElement("li");
            li.textContent = t;
            if (t === current) li.setAttribute("aria-current", "true");
            li.onclick = () => {
              if (t in sheets) {
                $("sheet").value = t;
                pick(t);
              } else {
                show(t);
              }
            };
            return li;
          }),
        );
      }

      function run() {
        $("err").textContent = "";
        try {
          result = alasql($("sql").value);
          if (!Array.isArray(result))
            throw new Error("Query must return rows (use SELECT)");
        } catch (e) {
          $("err").textContent = e.message;
          return;
        }
        render();
      }

      function render() {
        const keys = result.length ? Object.keys(result[0]) : [];
        const t = document.createElement("table");
        t.innerHTML = "<thead><tr></tr></thead><tbody></tbody>";
        t.tHead.rows[0].replaceChildren(
          ...keys.map((k) =>
            Object.assign(document.createElement("th"), { textContent: k }),
          ),
        );
        result.slice(0, MAX_PREVIEW).forEach((r) => {
          const tr = t.tBodies[0].insertRow();
          keys.forEach((k) => (tr.insertCell().textContent = fmt(r[k])));
        });
        $("preview").replaceChildren(t);
        $("count").textContent =
          `${result.length} rows` +
          (result.length > MAX_PREVIEW ? ` (showing ${MAX_PREVIEW})` : "");
        $("copy").disabled = $("dl").disabled = !result.length;
      }

      const fmt = (v) =>
        v instanceof Date
          ? v.toISOString().slice(0, 10)
          : v !== null && typeof v === "object"
            ? JSON.stringify(v)
            : (v ?? "");

      let timer;
      $("sql").oninput = () => (
        clearTimeout(timer),
        (timer = setTimeout(run, 300))
      );

      $("copy").onclick = async () => {
        const keys = Object.keys(result[0]);
        const tsv = [
          keys,
          ...result.map((r) =>
            keys.map((k) => String(fmt(r[k])).replace(/[\t\r\n]+/g, " ")),
          ),
        ];
        await navigator.clipboard.writeText(
          tsv.map((r) => r.join("\t")).join("\n"),
        );
        $("copy").textContent = "Copied!";
        setTimeout(() => ($("copy").textContent = "Copy rows"), 1200);
      };

      $("dl").onclick = () => {
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(
          wb,
          XLSX.utils.json_to_sheet(result),
          "result",
        );
        XLSX.writeFile(wb, "converted.xlsx");
      };
    </script>
  </body>
</html>
